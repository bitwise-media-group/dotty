#
# dotty consumes the shared toolchain (bitwise-media-group/toolchain) as the
# .mise/ submodule: pinned tools come from its config.toml (loaded natively as
# .mise/config.toml), the shared tasks from common/ and the go archetype, and
# the Makefile is a thin forwarder (.mise/archetypes/go/include.mk). Structural
# knobs live in [vars]; repo-local tasks live in tasks.toml (see [task_config]
# below).

[settings]
lockfile = true

[tools]
go = "1.27.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"

[vars]
app = "dotty"
app_pkg = "./cmd"

[task_config]
# common first, then exactly one archetype, then the repo-local tasks.toml —
# included AFTER the archetype so a same-named task there (fuzz) replaces the
# archetype's definition (later includes win whole-task, and an included file
# also beats this config's own [tasks] on name collisions).
includes = [
  ".mise/common/tasks.toml",
  ".mise/archetypes/go/tasks.toml",
  "tasks.toml",
]
