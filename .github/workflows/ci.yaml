# Continuous integration — thin caller for the org's reusable ci workflow (v5+:
# mise-task aware). It discovers the canonical tasks this repo defines and runs
# `mise run lint` / `build` / `test` as one parallel job each, then Codecov
# uploads from coverage/ — emitted by `mise run test`. `lint` carries all
# check-mode static analysis — golangci-lint, govulncheck, addlicense,
# markdownlint, prettier --check — with the pinned tools coming from the
# toolchain submodule at .mise/ (no package.json or .node-version: mise
# provisions its own Node for the prose linters). Go itself comes from the root
# mise.toml pin, not go.mod.
#
# The reusable workflow is pinned to a full commit SHA (tag in the comment) so a
# moved tag can never change what runs; Renovate keeps the pin fresh.
name: Continuous Integration

on:
    push:
        branches: [main]
    pull_request:

# the reusable workflow's jobs only need contents:read; grant just that ceiling
permissions:
    contents: read

jobs:
    ci:
        uses: bitwise-media-group/github-workflows/.github/workflows/ci.yaml@8b34c6fe87a61fc2f800876e9268bc1da8635e88 # v8.0.0
