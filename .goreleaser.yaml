# GoReleaser config. Releases are cut by release-please: when its release PR merges,
# the reusable release workflow (.github/workflows/release.yaml) pushes the vX.Y.Z
# tag, leaves a draft GitHub release, and runs `goreleaser release` — which adopts
# that draft (use_existing_draft + mode: replace below). Build locally without
# publishing via `make snapshot`.
#
# Produces cross-platform binary archives + checksums + SBOMs, keyless cosign
# signatures (linux) and Developer ID-signed, notarized darwin binaries, and
# pushes a Homebrew cask to bitwise-media-group/homebrew-tap. SBOMs
# are generated by the syft pinned in the toolchain submodule (.mise/config.toml),
# which mise puts on PATH for whoever runs goreleaser (the library's snapshot and
# release tasks locally, the reusable release workflow in CI). dotty drives
# local hardware and Homebrew, so no container images.
version: 2

# ^ref: https://goreleaser.com/errors/multiple-tokens/
force_token: github

project_name: dotty

before:
    hooks:
        - go mod download

env:
    - CGO_ENABLED=0

builds:
    - id: dotty
      main: ./cmd
      binary: dotty
      flags:
          - -trimpath
      # shared with the darwin build below (same binary, split only by goos)
      ldflags: &dotty_ldflags
          - -s -w
          - -X github.com/bitwise-media-group/dotty/internal/version.Version={{ .Version }}
          - -X github.com/bitwise-media-group/dotty/internal/version.Commit={{ .ShortCommit }}
          - -X github.com/bitwise-media-group/dotty/internal/version.BuildDate={{ .Date }}
      goos:
          - linux
      goarch:
          - amd64
          - arm64
    # darwin is a separate build id purely so binary_signs (cosign) can exclude
    # it by id: goreleaser runs binary_signs BEFORE notarize, and notarization
    # rewrites the Mach-O in place, so a cosign bundle over the pre-notarized
    # bytes would never verify against the shipped binary. The OSS binary_signs
    # has no per-artifact `if`, so the build id is the only handle. Archive
    # names are unchanged (the template keys on ProjectName/Os/Arch, not the id).
    - id: dotty-darwin
      main: ./cmd
      binary: dotty
      flags:
          - -trimpath
      ldflags: *dotty_ldflags
      goos:
          - darwin
      goarch:
          - amd64
          - arm64

archives:
    - id: dotty
      formats: [tar.gz]
      name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
      files:
          - LICENSE
          # Ship the man pages in the archive so the Homebrew cask can install
          # them from the extracted tarball (see homebrew_casks.manpages below).
          - docs/man/*.1
          # Pre-generated shell completions (committed by `mise run docs`), so
          # the cask installs them as static files instead of executing the
          # binary at install time (see homebrew_casks.completions below).
          - completions/*

checksum:
    name_template: checksums.txt

# ^ref: https://goreleaser.com/customization/sign/sign/
# Keyless cosign signatures over the linux binaries; the reusable release
# workflow supplies the GitHub Actions OIDC token. The darwin binaries are
# excluded by build id and carry the Apple signature + notarization below
# instead (cosign runs before notarize and would sign the wrong bytes); the
# SLSA attestation over checksums.txt still covers their archives.
# `make snapshot` skips this (--skip=sign).
binary_signs:
    - cmd: cosign
      ids: [dotty]
      signature: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}.sigstore.json"
      args:
          - sign-blob
          - --bundle=${signature}
          - ${artifact}
          - --yes
      output: true

# ^ref: https://goreleaser.com/customization/sign/notarize/
# Developer ID signing + Apple notarization of the darwin binaries, done
# cross-platform by goreleaser's embedded quill (no macOS runner). Certificate
# and API key arrive as env from the reusable release workflow, from the org
# secrets shared by every open-source repo that notarizes.
# enabled: every real release notarizes and fails if the secrets are missing
# (a published release is never un-notarized, which is what lets the cask
# skip the quarantine workaround); a snapshot only does when MACOS_SIGN_P12 is
# exported, so `make snapshot` stays offline and a local end-to-end test is
# one env export away.
notarize:
    macos:
        - enabled: '{{ or (not .IsSnapshot) (isEnvSet "MACOS_SIGN_P12") }}'
          ids: [dotty-darwin]
          sign:
              certificate: "{{ .Env.MACOS_SIGN_P12 }}"
              password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
          notarize:
              issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
              key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
              key: "{{ .Env.MACOS_NOTARY_KEY }}"
              wait: true
              timeout: 15m

sboms:
    - artifacts: archive
      # syft comes from the toolchain submodule's pins (.mise/config.toml);
      # mise puts it on PATH inside the library's snapshot/release tasks.
      cmd: syft
      args:
          - $artifact
          - --output
          - spdx-json=$document

snapshot:
    version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
    sort: asc
    use: github
    format: "{{ .SHA }}: {{ .Message }}{{ if and (not .IsNightly) .Logins }} ({{ .Logins | englishJoin }}){{ end }}"
    filters:
        exclude:
            - "^test"
            - "^chore"
            - "^build"
    groups:
        - title: "New Features"
          regexp: '^.*?feat(\(.+\))??!?:.+$'
          order: 100
        - title: "Security Updates"
          regexp: '^.*?sec(\(.+\))??!?:.+$'
          order: 150
        - title: "Bug Fixes"
          regexp: '^.*?(fix|refactor)(\(.+\))??!?:.+$'
          order: 200
        - title: "Documentation Updates"
          regexp: ^.*?docs?(\(.+\))??!?:.+$
          order: 400
        - title: Other Work
          order: 9999

release:
    github:
        owner: bitwise-media-group
        name: dotty
    # The release-please job in release.yaml leaves a draft release named after
    # the tag it pushes. Adopt that draft instead of creating a second release,
    # swap its release-please notes for the grouped changelog above, and
    # undraft it only once every asset has been uploaded.
    use_existing_draft: true
    mode: replace

# ^ref: https://goreleaser.com/customization/homebrew_casks/
homebrew_casks:
    - name: dotty
      binaries: [dotty]
      # Glob-matched against the files bundled into the archive above; goreleaser
      # emits a `manpage "..."` stanza for each match (e.g. docs/man/dotty.1).
      manpages:
          - docs/man/*.1
      # Static completion stanzas, NOT generate_completions_from_executable:
      # the committed completions/* are deterministic output of `mise run docs`
      # and install as plain files, so the cask never executes the binary at
      # install time and the install is reproducible from the archive alone.
      # (Static bash_completion / zsh_completion / fish_completion artifacts are
      # also ordered deterministically by Homebrew, which GeneratedCompletion —
      # missing from brew's artifact sort table as of 6.0 — is not.)
      completions:
          bash: completions/dotty.bash
          zsh: completions/dotty.zsh
          fish: completions/dotty.fish
      homepage: https://github.com/bitwise-media-group/dotty
      description: Terminal-driven dotfiles workflow — portable profiles, reproducible Brewfiles, and YubiKey-backed SSH signing keys
      skip_upload: auto
      repository:
          owner: bitwise-media-group
          name: homebrew-tap
          branch: main
          token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"

