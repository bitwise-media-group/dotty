# Rendered by dotty init for the component named in the file name; the next
# init re-renders it and deselecting the component removes it. Add your own
# packages to ../config.toml instead.
# The registry's http backend, spelled out: a bare "http:grok" has no URL, so
# the declaration carries the download template and version list the
# registry's `grok` short name expands to. x.ai publishes the CLI as a plain
# per-platform binary.
[tools]
"http:grok" = { version = "latest", bin = "grok", url = 'https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-{{ os() }}-{{ arch(x64="x86_64", arm64="aarch64") }}', version_list_url = "https://x.ai/cli/stable" }
