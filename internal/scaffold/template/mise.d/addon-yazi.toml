# Rendered by dotty init for the component named in the file name; the next
# init re-renders it and deselecting the component removes it. Add your own
# packages to ../config.toml instead.
[tools]
"aqua:linebender/resvg" = "latest"
"aqua:sxyazi/yazi" = "latest"

# Native libraries the previewers link against; no static builds exist.
[bootstrap.packages]
"brew:chafa" = "latest"
"brew:ffmpeg" = "latest"
"brew:poppler" = "latest"
