# Rendered by dotty init for the macOS defaults group named in the file name;
# the next init re-renders it and deselecting the group removes it. Add your
# own settings to ../config.toml instead.
# The ABC keyboard layout plus the emoji & symbols viewer, with the input
# menu hidden from the menu bar.
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.HIToolbox"
key = "AppleEnabledInputSources"
value = [
  { InputSourceKind = "Keyboard Layout", "KeyboardLayout ID" = 252, "KeyboardLayout Name" = "ABC" },
  { InputSourceKind = "Non Keyboard Input Method", "Bundle ID" = "com.apple.CharacterPaletteIM" },
]

[bootstrap.macos.defaults."com.apple.TextInputMenu"]
visible = false
