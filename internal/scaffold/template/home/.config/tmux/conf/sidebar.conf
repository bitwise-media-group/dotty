# session sidebar — `dotty tmux sidebar`
#
# one sidebar pane for the whole server, following the client between windows
# and sessions. it blocks on the `dotty-tree` wait-for channel at zero cpu and
# every hook here only signals that channel or records where the client is, so
# switching windows forks nothing. the one exception is creating the sidebar,
# which runs only when it is switched on but missing.
#
# @dotty_sidebar        on | off — whether the sidebar shows (toggled by ++s++)
# @dotty_sidebar_target the window the client last switched to
# @dotty_is_sidebar     pane option marking the sidebar pane itself

# default on, but don't clobber a toggle when re-sourcing
if -F '#{==:#{@dotty_sidebar},}' { set -g @dotty_sidebar on }

# follow: record the window now in view and wake the sidebar, creating it only
# when it is switched on and no pane is (or is starting as) the sidebar. the
# body is repeated per hook because %hidden variables can't hold a brace block.
set-hook -g 'client-attached[90]' {
	set -gF @dotty_sidebar_target '#{window_id}'
	wait-for -S dotty-tree
	if -F '#{&&:#{==:#{@dotty_sidebar},on},#{==:#{S:#{W:#{P:#{?#{||:#{@dotty_is_sidebar},#{m:*dotty tmux sidebar*,#{pane_start_command}}},1,}}}},}}' {
		run-shell -b 'command -v dotty >/dev/null 2>&1 && dotty tmux sidebar ensure || true'
	}
}
set-hook -g 'client-session-changed[90]' {
	set -gF @dotty_sidebar_target '#{window_id}'
	wait-for -S dotty-tree
	if -F '#{&&:#{==:#{@dotty_sidebar},on},#{==:#{S:#{W:#{P:#{?#{||:#{@dotty_is_sidebar},#{m:*dotty tmux sidebar*,#{pane_start_command}}},1,}}}},}}' {
		run-shell -b 'command -v dotty >/dev/null 2>&1 && dotty tmux sidebar ensure || true'
	}
}
# a background session changing window must not drag the sidebar away
set-hook -g 'session-window-changed[90]' {
	if -F '#{session_attached}' {
		set -gF @dotty_sidebar_target '#{window_id}'
		wait-for -S dotty-tree
		if -F '#{&&:#{==:#{@dotty_sidebar},on},#{==:#{S:#{W:#{P:#{?#{||:#{@dotty_is_sidebar},#{m:*dotty tmux sidebar*,#{pane_start_command}}},1,}}}},}}' {
			run-shell -b 'command -v dotty >/dev/null 2>&1 && dotty tmux sidebar ensure || true'
		}
	}
}

# structural changes: refresh the tree
set-hook -g 'session-created[90]' 'wait-for -S dotty-tree'
set-hook -g 'session-closed[90]' 'wait-for -S dotty-tree'
set-hook -g 'session-renamed[90]' 'wait-for -S dotty-tree'
set-hook -g 'window-linked[90]' 'wait-for -S dotty-tree'
set-hook -g 'window-unlinked[90]' 'wait-for -S dotty-tree'
set-hook -g 'window-renamed[90]' 'wait-for -S dotty-tree'
set-hook -g 'pane-exited[90]' 'wait-for -S dotty-tree'
set-hook -g 'after-kill-pane[90]' 'wait-for -S dotty-tree'
